name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned: `-D warnings` on a floating stable turns a clippy release
      # into a build break with no change here. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc
      - name: CLI smoke test
        run: cargo run --release -- matrix examples/laws50.txt --max-size 3 --out-dir out

  # Tests also run against current stable, so real breakage still surfaces
  # even though the lint job is pinned.
  test-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  # The MSRV in Cargo.toml is a promise, so it gets tested rather than asserted.
  # Library and binaries only: an MSRV is what a consumer of this crate needs,
  # and consumers never build criterion or proptest.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --bins
